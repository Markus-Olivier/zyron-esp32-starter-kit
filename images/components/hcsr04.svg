<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <rect width="320" height="220" fill="#1a1a2e"/>

  <!-- PCB board -->
  <rect x="50" y="35" width="220" height="120" rx="6" fill="#1a4a8a" stroke="#2a6aaa" stroke-width="2"/>

  <!-- Transmitter cylinder -->
  <ellipse cx="120" cy="95" rx="34" ry="34" fill="#c0c0c0" stroke="#888" stroke-width="2"/>
  <ellipse cx="120" cy="95" rx="28" ry="28" fill="#888"/>
  <ellipse cx="120" cy="95" rx="20" ry="20" fill="#555"/>
  <ellipse cx="120" cy="95" rx="12" ry="12" fill="#333"/>
  <text x="120" y="145" font-family="monospace" font-size="9" fill="#aaddff" text-anchor="middle">T (Trig)</text>

  <!-- Receiver cylinder -->
  <ellipse cx="200" cy="95" rx="34" ry="34" fill="#c0c0c0" stroke="#888" stroke-width="2"/>
  <ellipse cx="200" cy="95" rx="28" ry="28" fill="#888"/>
  <ellipse cx="200" cy="95" rx="20" ry="20" fill="#555"/>
  <ellipse cx="200" cy="95" rx="12" ry="12" fill="#333"/>
  <text x="200" y="145" font-family="monospace" font-size="9" fill="#aaddff" text-anchor="middle">R (Echo)</text>

  <!-- Label -->
  <text x="160" y="52" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">HC-SR04</text>

  <!-- Pins -->
  <rect x="68" y="155" width="8" height="28" rx="1" fill="#aaa"/>
  <rect x="88" y="155" width="8" height="28" rx="1" fill="#aaa"/>
  <rect x="108" y="155" width="8" height="28" rx="1" fill="#aaa"/>
  <rect x="128" y="155" width="8" height="28" rx="1" fill="#aaa"/>

  <!-- Pin labels -->
  <text x="72" y="196" font-family="monospace" font-size="9" fill="#e94560" text-anchor="middle">VCC</text>
  <text x="92" y="196" font-family="monospace" font-size="9" fill="#ffcc00" text-anchor="middle">TRIG</text>
  <text x="112" y="196" font-family="monospace" font-size="9" fill="#ff8800" text-anchor="middle">ECHO</text>
  <text x="132" y="196" font-family="monospace" font-size="9" fill="#5599ff" text-anchor="middle">GND</text>

  <!-- Warning badge -->
  <rect x="155" y="160" width="108" height="26" rx="4" fill="#cc3300" opacity="0.85"/>
  <text x="209" y="171" font-family="sans-serif" font-size="8" fill="white" text-anchor="middle" font-weight="bold">⚠ ECHO = 5V</text>
  <text x="209" y="182" font-family="sans-serif" font-size="8" fill="white" text-anchor="middle">Use voltage divider!</text>

  <!-- Title -->
  <text x="160" y="212" font-family="sans-serif" font-size="9" fill="#e94560" text-anchor="middle">HC-SR04 Ultrasonic Distance Sensor — zyron.co.za</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300">
  <rect width="480" height="300" fill="#1a1a2e"/>

  <!-- PCB body -->
  <rect x="80" y="30" width="320" height="240" rx="6" fill="#1a6b1a" stroke="#2d8a2d" stroke-width="2"/>

  <!-- USB port -->
  <rect x="30" y="120" width="52" height="36" rx="4" fill="#888" stroke="#aaa" stroke-width="1.5"/>
  <rect x="36" y="125" width="40" height="26" rx="2" fill="#555"/>
  <text x="56" y="164" font-family="monospace" font-size="9" fill="#ccc" text-anchor="middle">USB</text>

  <!-- Antenna area -->
  <rect x="396" y="36" width="4" height="30" fill="#d4af37"/>
  <path d="M400 36 L420 36 L420 46 L400 46 L400 56 L420 56 L420 66 L400 66" fill="none" stroke="#d4af37" stroke-width="3"/>

  <!-- ESP32 module (silver) -->
  <rect x="145" y="85" width="190" height="100" rx="4" fill="#b0b0b0" stroke="#888" stroke-width="1"/>
  <rect x="152" y="92" width="176" height="86" rx="2" fill="#777"/>
  <text x="240" y="132" font-family="monospace" font-size="11" fill="#eee" text-anchor="middle" font-weight="bold">ESP32</text>
  <text x="240" y="148" font-family="monospace" font-size="9" fill="#ccc" text-anchor="middle">WROOM-32</text>
  <text x="240" y="163" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">240MHz · WiFi · BT</text>

  <!-- EN button -->
  <rect x="165" y="48" width="28" height="18" rx="3" fill="#cc3333" stroke="#aa1111" stroke-width="1"/>
  <text x="179" y="61" font-family="monospace" font-size="7" fill="white" text-anchor="middle">EN</text>

  <!-- BOOT button -->
  <rect x="286" y="48" width="38" height="18" rx="3" fill="#3355cc" stroke="#1133aa" stroke-width="1"/>
  <text x="305" y="61" font-family="monospace" font-size="7" fill="white" text-anchor="middle">BOOT</text>

  <!-- Status LED -->
  <circle cx="240" cy="63" r="5" fill="#00dd00" opacity="0.9"/>
  <text x="240" y="80" font-family="monospace" font-size="7" fill="#aaffaa" text-anchor="middle">LED</text>

  <!-- Left pin row -->
  <g fill="#d4af37" stroke="#a08020" stroke-width="0.5">
    <rect x="82" y="38" width="8" height="8" rx="1"/>
    <rect x="82" y="52" width="8" height="8" rx="1"/>
    <rect x="82" y="66" width="8" height="8" rx="1"/>
    <rect x="82" y="80" width="8" height="8" rx="1"/>
    <rect x="82" y="94" width="8" height="8" rx="1"/>
    <rect x="82" y="108" width="8" height="8" rx="1"/>
    <rect x="82" y="122" width="8" height="8" rx="1"/>
    <rect x="82" y="136" width="8" height="8" rx="1"/>
    <rect x="82" y="150" width="8" height="8" rx="1"/>
    <rect x="82" y="164" width="8" height="8" rx="1"/>
    <rect x="82" y="178" width="8" height="8" rx="1"/>
    <rect x="82" y="192" width="8" height="8" rx="1"/>
    <rect x="82" y="206" width="8" height="8" rx="1"/>
    <rect x="82" y="220" width="8" height="8" rx="1"/>
    <rect x="82" y="234" width="8" height="8" rx="1"/>
    <rect x="82" y="248" width="8" height="8" rx="1"/>
  </g>
  <!-- Right pin row -->
  <g fill="#d4af37" stroke="#a08020" stroke-width="0.5">
    <rect x="390" y="38" width="8" height="8" rx="1"/>
    <rect x="390" y="52" width="8" height="8" rx="1"/>
    <rect x="390" y="66" width="8" height="8" rx="1"/>
    <rect x="390" y="80" width="8" height="8" rx="1"/>
    <rect x="390" y="94" width="8" height="8" rx="1"/>
    <rect x="390" y="108" width="8" height="8" rx="1"/>
    <rect x="390" y="122" width="8" height="8" rx="1"/>
    <rect x="390" y="136" width="8" height="8" rx="1"/>
    <rect x="390" y="150" width="8" height="8" rx="1"/>
    <rect x="390" y="164" width="8" height="8" rx="1"/>
    <rect x="390" y="178" width="8" height="8" rx="1"/>
    <rect x="390" y="192" width="8" height="8" rx="1"/>
    <rect x="390" y="206" width="8" height="8" rx="1"/>
    <rect x="390" y="220" width="8" height="8" rx="1"/>
    <rect x="390" y="234" width="8" height="8" rx="1"/>
    <rect x="390" y="248" width="8" height="8" rx="1"/>
  </g>

  <!-- Left pin labels -->
  <g font-family="monospace" font-size="7.5" fill="#88ff88">
    <text x="76" y="45"  text-anchor="end">3.3V</text>
    <text x="76" y="59"  text-anchor="end">GND</text>
    <text x="76" y="73"  text-anchor="end">IO15</text>
    <text x="76" y="87"  text-anchor="end">IO2</text>
    <text x="76" y="101" text-anchor="end">IO4</text>
    <text x="76" y="115" text-anchor="end">IO5</text>
    <text x="76" y="129" text-anchor="end">IO18</text>
    <text x="76" y="143" text-anchor="end">IO19</text>
    <text x="76" y="157" text-anchor="end">IO21</text>
    <text x="76" y="171" text-anchor="end">IO22</text>
    <text x="76" y="185" text-anchor="end">IO23</text>
    <text x="76" y="199" text-anchor="end">IO25</text>
    <text x="76" y="213" text-anchor="end">IO26</text>
    <text x="76" y="227" text-anchor="end">IO27</text>
    <text x="76" y="241" text-anchor="end">IO14</text>
    <text x="76" y="255" text-anchor="end">GND</text>
  </g>
  <!-- Right pin labels -->
  <g font-family="monospace" font-size="7.5" fill="#88ff88">
    <text x="402" y="45">GND</text>
    <text x="402" y="59">IO23</text>
    <text x="402" y="73">IO22 SCL</text>
    <text x="402" y="87">TX</text>
    <text x="402" y="101">RX</text>
    <text x="402" y="115">IO21 SDA</text>
    <text x="402" y="129">IO19</text>
    <text x="402" y="143">IO18</text>
    <text x="402" y="157">IO5</text>
    <text x="402" y="171">IO17</text>
    <text x="402" y="185">IO16</text>
    <text x="402" y="199">IO4</text>
    <text x="402" y="213">IO0</text>
    <text x="402" y="227">IO2 LED</text>
    <text x="402" y="241">IO15</text>
    <text x="402" y="255">5V VIN</text>
  </g>

  <!-- Title -->
  <text x="240" y="283" font-family="sans-serif" font-size="11" fill="#e94560" text-anchor="middle" font-weight="bold">ESP32 DevKit v1 — zyron.co.za</text>
</svg>

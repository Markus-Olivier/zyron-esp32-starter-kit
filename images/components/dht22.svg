<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <rect width="320" height="220" fill="#1a1a2e"/>

  <!-- Sensor housing -->
  <rect x="90" y="30" width="140" height="110" rx="8" fill="#e8e8e8" stroke="#ccc" stroke-width="2"/>

  <!-- Mesh grill (front face) -->
  <rect x="100" y="38" width="120" height="70" rx="4" fill="#d0d0d0" stroke="#bbb" stroke-width="1"/>
  <!-- Mesh pattern -->
  <g stroke="#aaa" stroke-width="0.8" opacity="0.7">
    <line x1="110" y1="38" x2="110" y2="108"/>
    <line x1="120" y1="38" x2="120" y2="108"/>
    <line x1="130" y1="38" x2="130" y2="108"/>
    <line x1="140" y1="38" x2="140" y2="108"/>
    <line x1="150" y1="38" x2="150" y2="108"/>
    <line x1="160" y1="38" x2="160" y2="108"/>
    <line x1="170" y1="38" x2="170" y2="108"/>
    <line x1="180" y1="38" x2="180" y2="108"/>
    <line x1="190" y1="38" x2="190" y2="108"/>
    <line x1="200" y1="38" x2="200" y2="108"/>
    <line x1="100" y1="50" x2="220" y2="50"/>
    <line x1="100" y1="62" x2="220" y2="62"/>
    <line x1="100" y1="74" x2="220" y2="74"/>
    <line x1="100" y1="86" x2="220" y2="86"/>
    <line x1="100" y1="98" x2="220" y2="98"/>
  </g>

  <!-- Label on housing -->
  <text x="160" y="128" font-family="monospace" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">DHT22</text>
  <text x="160" y="143" font-family="monospace" font-size="9" fill="#555" text-anchor="middle">AM2302</text>

  <!-- Pins -->
  <rect x="108" y="140" width="8" height="30" rx="1" fill="#aaa"/>
  <rect x="128" y="140" width="8" height="30" rx="1" fill="#aaa"/>
  <rect x="148" y="140" width="8" height="30" rx="1" fill="#aaa"/>
  <rect x="168" y="140" width="8" height="25" rx="1" fill="#555" opacity="0.4"/>

  <!-- Pin labels -->
  <text x="112" y="185" font-family="monospace" font-size="9" fill="#e94560" text-anchor="middle">VCC</text>
  <text x="132" y="185" font-family="monospace" font-size="9" fill="#aaffaa" text-anchor="middle">DATA</text>
  <text x="172" y="185" font-family="monospace" font-size="9" fill="#888" text-anchor="middle">NC</text>
  <text x="152" y="185" font-family="monospace" font-size="9" fill="#5599ff" text-anchor="middle">GND</text>

  <!-- Specs -->
  <text x="160" y="202" font-family="sans-serif" font-size="9" fill="#888" text-anchor="middle">-40°C to +80°C · 0–100% RH · ±0.5°C</text>

  <!-- Title -->
  <text x="160" y="216" font-family="sans-serif" font-size="9" fill="#e94560" text-anchor="middle">DHT22 Temperature &amp; Humidity — zyron.co.za</text>
</svg>

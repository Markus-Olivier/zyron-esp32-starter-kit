<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" width="280" height="220">
  <rect width="280" height="220" fill="#1a1a2e"/>

  <!-- Buzzer body (cylinder top view) -->
  <ellipse cx="140" cy="100" rx="60" ry="60" fill="#111" stroke="#555" stroke-width="2.5"/>
  <ellipse cx="140" cy="100" rx="54" ry="54" fill="#222"/>

  <!-- Sticker on top -->
  <ellipse cx="140" cy="100" rx="45" ry="45" fill="#f5f5dc" stroke="#ccc" stroke-width="1"/>
  <text x="140" y="90" font-family="monospace" font-size="9" fill="#333" text-anchor="middle">ACTIVE</text>
  <text x="140" y="103" font-family="monospace" font-size="9" fill="#333" text-anchor="middle">BUZZER</text>
  <text x="140" y="116" font-family="monospace" font-size="9" fill="#333" text-anchor="middle">5V</text>

  <!-- Positive marking -->
  <text x="174" y="88" font-family="monospace" font-size="14" fill="#333" font-weight="bold">+</text>

  <!-- Pins -->
  <!-- Positive (longer) -->
  <rect x="121" y="160" width="7" height="38" rx="1" fill="#d4af37"/>
  <!-- Negative (shorter) -->
  <rect x="152" y="166" width="7" height="32" rx="1" fill="#888"/>

  <!-- Pin labels -->
  <text x="124" y="207" font-family="monospace" font-size="9" fill="#e94560" text-anchor="middle">+</text>
  <text x="155" y="207" font-family="monospace" font-size="9" fill="#5599ff" text-anchor="middle">−</text>
  <text x="124" y="216" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">long</text>
  <text x="155" y="216" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">short</text>

  <!-- Sound waves -->
  <g fill="none" stroke="#ffcc00" stroke-width="1.5" opacity="0.6">
    <path d="M210 80 Q225 100 210 120"/>
    <path d="M218 72 Q240 100 218 128"/>
    <path d="M226 64 Q255 100 226 136"/>
  </g>

  <!-- Title -->
  <text x="140" y="15" font-family="sans-serif" font-size="10" fill="#e94560" text-anchor="middle" font-weight="bold">Active Buzzer — zyron.co.za</text>
  <text x="140" y="28" font-family="sans-serif" font-size="9" fill="#888" text-anchor="middle">Built-in oscillator · fixed tone · GPIO HIGH = ON</text>
</svg>

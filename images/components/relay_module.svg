<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220">
  <rect width="360" height="220" fill="#1a1a2e"/>

  <!-- PCB -->
  <rect x="40" y="40" width="280" height="130" rx="5" fill="#1a6b1a" stroke="#2a8a2a" stroke-width="2"/>

  <!-- Relay body (black rectangular block) -->
  <rect x="80" y="55" width="110" height="70" rx="4" fill="#222" stroke="#555" stroke-width="1.5"/>
  <text x="135" y="85" font-family="monospace" font-size="9" fill="#aaa" text-anchor="middle">RELAY</text>
  <text x="135" y="98" font-family="monospace" font-size="7" fill="#888" text-anchor="middle">SRD-05VDC-SL-C</text>
  <text x="135" y="111" font-family="monospace" font-size="7" fill="#888" text-anchor="middle">10A / 250V AC</text>

  <!-- Status LED -->
  <circle cx="230" cy="75" r="7" fill="#00cc00"/>
  <text x="230" y="92" font-family="monospace" font-size="7" fill="#aaffaa" text-anchor="middle">LED</text>

  <!-- Screw terminals (load side) -->
  <rect x="270" y="55" width="36" height="70" rx="3" fill="#444" stroke="#666" stroke-width="1"/>
  <rect x="273" y="60" width="30" height="16" rx="2" fill="#333"/>
  <rect x="275" y="62" width="8" height="12" rx="1" fill="#888"/>
  <text x="288" y="72" font-family="monospace" font-size="7" fill="#aaa">COM</text>
  <rect x="273" y="80" width="30" height="16" rx="2" fill="#333"/>
  <rect x="275" y="82" width="8" height="12" rx="1" fill="#888"/>
  <text x="288" y="92" font-family="monospace" font-size="7" fill="#aaffaa">NO</text>
  <rect x="273" y="100" width="30" height="16" rx="2" fill="#333"/>
  <rect x="275" y="102" width="8" height="12" rx="1" fill="#888"/>
  <text x="288" y="112" font-family="monospace" font-size="7" fill="#ffaaaa">NC</text>

  <!-- Control pins -->
  <rect x="55" y="170" width="8" height="22" rx="1" fill="#aaa"/>
  <rect x="75" y="170" width="8" height="22" rx="1" fill="#aaa"/>
  <rect x="95" y="170" width="8" height="22" rx="1" fill="#aaa"/>

  <!-- Control pin labels -->
  <text x="59"  y="204" font-family="monospace" font-size="9" fill="#e94560" text-anchor="middle">VCC</text>
  <text x="79"  y="204" font-family="monospace" font-size="9" fill="#5599ff" text-anchor="middle">GND</text>
  <text x="99"  y="204" font-family="monospace" font-size="9" fill="#aaffaa" text-anchor="middle">IN</text>
  <text x="79"  y="215" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">GPIO 26</text>

  <!-- Load side label -->
  <text x="288" y="148" font-family="monospace" font-size="7" fill="#888" text-anchor="middle">LOAD</text>
  <text x="288" y="158" font-family="monospace" font-size="7" fill="#888" text-anchor="middle">SIDE</text>

  <!-- Control side label -->
  <text x="79" y="160" font-family="monospace" font-size="7" fill="#888" text-anchor="middle">CTRL</text>

  <!-- Logic note -->
  <rect x="130" y="160" width="120" height="16" rx="3" fill="#cc3300" opacity="0.7"/>
  <text x="190" y="172" font-family="sans-serif" font-size="8" fill="white" text-anchor="middle">LOW = ON (active-LOW)</text>

  <!-- Title -->
  <text x="180" y="15" font-family="sans-serif" font-size="10" fill="#e94560" text-anchor="middle" font-weight="bold">5V Relay Module — zyron.co.za</text>
  <text x="180" y="28" font-family="sans-serif" font-size="9" fill="#888" text-anchor="middle">NO = Normally Open · NC = Normally Closed</text>
</svg>

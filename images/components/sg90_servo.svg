<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <rect width="320" height="220" fill="#1a1a2e"/>

  <!-- Servo gearbox body -->
  <rect x="95" y="55" width="130" height="100" rx="6" fill="#ddd" stroke="#bbb" stroke-width="2"/>

  <!-- Top face detail -->
  <rect x="103" y="62" width="114" height="35" rx="3" fill="#ccc"/>
  <text x="160" y="75" font-family="monospace" font-size="10" fill="#333" text-anchor="middle" font-weight="bold">SG90</text>
  <text x="160" y="88" font-family="monospace" font-size="8" fill="#555" text-anchor="middle">9g SERVO</text>

  <!-- Output shaft circle -->
  <circle cx="160" cy="120" r="18" fill="#888" stroke="#666" stroke-width="2"/>
  <circle cx="160" cy="120" r="12" fill="#aaa"/>
  <circle cx="160" cy="120" r="4"  fill="#555"/>

  <!-- Servo horn (cross) -->
  <rect x="143" y="117" width="34" height="6" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <rect x="157" y="103" width="6" height="34" rx="3" fill="#fff" stroke="#ddd" stroke-width="1"/>

  <!-- Mounting tabs -->
  <rect x="75"  y="80" width="20" height="40" rx="3" fill="#ccc" stroke="#bbb" stroke-width="1"/>
  <circle cx="85"  cy="100" r="5" fill="#888"/>
  <rect x="225" y="80" width="20" height="40" rx="3" fill="#ccc" stroke="#bbb" stroke-width="1"/>
  <circle cx="235" cy="100" r="5" fill="#888"/>

  <!-- Cable -->
  <line x1="140" y1="155" x2="140" y2="185" stroke="#8B4513" stroke-width="4"/>
  <line x1="155" y1="155" x2="155" y2="185" stroke="#cc0000" stroke-width="4"/>
  <line x1="170" y1="155" x2="170" y2="185" stroke="#ff8800" stroke-width="4"/>

  <!-- Connector block -->
  <rect x="128" y="183" width="54" height="14" rx="2" fill="#333" stroke="#555"/>
  <rect x="131" y="185" width="10" height="10" rx="1" fill="#555"/>
  <rect x="145" y="185" width="10" height="10" rx="1" fill="#555"/>
  <rect x="159" y="185" width="10" height="10" rx="1" fill="#555"/>

  <!-- Wire labels -->
  <text x="140" y="210" font-family="monospace" font-size="8" fill="#c8a070" text-anchor="middle">GND</text>
  <text x="155" y="210" font-family="monospace" font-size="8" fill="#e94560" text-anchor="middle">VCC</text>
  <text x="171" y="210" font-family="monospace" font-size="8" fill="#ffaa00" text-anchor="middle">SIG</text>

  <!-- Title -->
  <text x="160" y="16" font-family="sans-serif" font-size="10" fill="#e94560" text-anchor="middle" font-weight="bold">SG90 Servo Motor — zyron.co.za</text>
  <text x="160" y="29" font-family="sans-serif" font-size="9" fill="#888" text-anchor="middle">0°–180° · 50Hz PWM · 5V · 9g</text>
</svg>

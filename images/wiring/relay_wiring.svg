<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300">
  <rect width="520" height="300" fill="#0f0f1a"/>

  <!-- ESP32 -->
  <rect x="30" y="50" width="80" height="170" rx="5" fill="#1a6b1a" stroke="#2d8a2d" stroke-width="1.5"/>
  <text x="70" y="70" font-family="monospace" font-size="9" fill="#fff" text-anchor="middle" font-weight="bold">ESP32</text>
  <rect x="108" y="80"  width="12" height="7" rx="1" fill="#d4af37"/>
  <rect x="108" y="100" width="12" height="7" rx="1" fill="#d4af37"/>
  <rect x="108" y="120" width="12" height="7" rx="1" fill="#d4af37"/>
  <text x="106" y="87"  font-family="monospace" font-size="7.5" fill="#e94560" text-anchor="end">5V VIN</text>
  <text x="106" y="107" font-family="monospace" font-size="7.5" fill="#5599ff" text-anchor="end">GND</text>
  <text x="106" y="127" font-family="monospace" font-size="7.5" fill="#aaffaa" text-anchor="end">GPIO26</text>

  <!-- Relay module -->
  <rect x="270" y="55" width="170" height="100" rx="5" fill="#1a6b1a" stroke="#2a8a2a" stroke-width="1.5"/>
  <!-- Relay block -->
  <rect x="280" y="65" width="80" height="55" rx="3" fill="#222" stroke="#444"/>
  <text x="320" y="88" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">RELAY</text>
  <text x="320" y="100" font-family="monospace" font-size="7" fill="#666" text-anchor="middle">10A/250V</text>
  <!-- LED indicator -->
  <circle cx="395" cy="82" r="6" fill="#00cc00"/>
  <text x="395" y="96" font-family="monospace" font-size="7" fill="#aaffaa" text-anchor="middle">LED</text>
  <!-- Screw terminals -->
  <rect x="395" y="65" width="36" height="55" rx="2" fill="#444" stroke="#666"/>
  <rect x="398" y="69" width="28" height="12" rx="1" fill="#333"/>
  <rect x="401" y="71" width="8" height="8" rx="1" fill="#777"/>
  <text x="415" y="78" font-family="monospace" font-size="7" fill="#fff">COM</text>
  <rect x="398" y="84" width="28" height="12" rx="1" fill="#333"/>
  <rect x="401" y="86" width="8" height="8" rx="1" fill="#777"/>
  <text x="415" y="93" font-family="monospace" font-size="7" fill="#aaffaa">NO</text>
  <rect x="398" y="99" width="28" height="12" rx="1" fill="#333"/>
  <rect x="401" y="101" width="8" height="8" rx="1" fill="#777"/>
  <text x="415" y="108" font-family="monospace" font-size="7" fill="#ffaaaa">NC</text>

  <!-- Control pins -->
  <rect x="285" y="155" width="7" height="20" rx="1" fill="#aaa"/>
  <rect x="305" y="155" width="7" height="20" rx="1" fill="#aaa"/>
  <rect x="325" y="155" width="7" height="20" rx="1" fill="#aaa"/>
  <text x="288" y="187" font-family="monospace" font-size="8" fill="#e94560" text-anchor="middle">VCC</text>
  <text x="308" y="187" font-family="monospace" font-size="8" fill="#5599ff" text-anchor="middle">GND</text>
  <text x="328" y="187" font-family="monospace" font-size="8" fill="#aaffaa" text-anchor="middle">IN</text>
  <text x="328" y="197" font-family="monospace" font-size="7" fill="#888" text-anchor="middle">LOW=ON</text>

  <!-- Load (LED strip / lamp) -->
  <rect x="410" y="150" width="80" height="40" rx="5" fill="#333" stroke="#555"/>
  <text x="450" y="166" font-family="monospace" font-size="8" fill="#ffcc00" text-anchor="middle">12V LOAD</text>
  <text x="450" y="178" font-family="monospace" font-size="7" fill="#888" text-anchor="middle">LED strip / fan</text>

  <!-- 12V supply -->
  <rect x="410" y="220" width="80" height="30" rx="4" fill="#555" stroke="#777"/>
  <text x="450" y="233" font-family="monospace" font-size="8" fill="#aaa" text-anchor="middle">12V DC</text>
  <text x="450" y="245" font-family="monospace" font-size="7" fill="#888" text-anchor="middle">supply</text>

  <!-- Wires — control side -->
  <!-- 5V → VCC (red) -->
  <polyline points="120,83 200,83 200,40 288,40 288,155" fill="none" stroke="#e94560" stroke-width="2.5"/>
  <!-- GND → GND (blue) -->
  <polyline points="120,103 308,103 308,155" fill="none" stroke="#5599ff" stroke-width="2.5"/>
  <!-- GPIO26 → IN (green) -->
  <polyline points="120,123 328,123 328,155" fill="none" stroke="#aaffaa" stroke-width="2.5"/>

  <!-- Load circuit wires -->
  <!-- 12V+ → COM (orange) -->
  <polyline points="450,220 450,200 416,200 416,120 413,120" fill="none" stroke="#ff8800" stroke-width="2.5"/>
  <!-- NO → Load (yellow) -->
  <polyline points="413,92 450,92 450,150" fill="none" stroke="#ffcc00" stroke-width="2.5"/>
  <!-- Load → 12V- (blue dashed) -->
  <polyline points="410,165 390,165 390,240 450,240 450,250" fill="none" stroke="#5599ff" stroke-width="2" stroke-dasharray="5,3"/>
  <polyline points="450,250 450,265" fill="none" stroke="#5599ff" stroke-width="2"/>

  <!-- Note box -->
  <rect x="30" y="252" width="360" height="36" rx="4" fill="#1a1a2e" stroke="#333"/>
  <text x="215" y="264" font-family="sans-serif" font-size="9" fill="#ffaaaa" text-anchor="middle">⚠ For AC 230V loads — ensure relay is rated &amp; all live wires are insulated</text>
  <text x="215" y="278" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">For learning: use 5–12V DC loads only</text>

  <!-- Title -->
  <text x="260" y="20" font-family="sans-serif" font-size="11" fill="#e94560" text-anchor="middle" font-weight="bold">Relay Module Wiring — Zyron ESP32 Starter Kit</text>
  <text x="260" y="34" font-family="sans-serif" font-size="9" fill="#888" text-anchor="middle">zyron.co.za</text>
</svg>

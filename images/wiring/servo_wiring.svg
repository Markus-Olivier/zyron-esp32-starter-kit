<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <rect width="480" height="270" fill="#0f0f1a"/>

  <!-- ESP32 -->
  <rect x="30" y="50" width="80" height="170" rx="5" fill="#1a6b1a" stroke="#2d8a2d" stroke-width="1.5"/>
  <text x="70" y="70" font-family="monospace" font-size="9" fill="#fff" text-anchor="middle" font-weight="bold">ESP32</text>
  <rect x="108" y="80"  width="12" height="7" rx="1" fill="#d4af37"/>
  <rect x="108" y="100" width="12" height="7" rx="1" fill="#d4af37"/>
  <rect x="108" y="120" width="12" height="7" rx="1" fill="#d4af37"/>
  <text x="106" y="87"  font-family="monospace" font-size="7.5" fill="#5599ff" text-anchor="end">GND</text>
  <text x="106" y="107" font-family="monospace" font-size="7.5" fill="#e94560" text-anchor="end">5V VIN</text>
  <text x="106" y="127" font-family="monospace" font-size="7.5" fill="#ff8800" text-anchor="end">GPIO13</text>

  <!-- SG90 Servo -->
  <rect x="310" y="80" width="120" height="80" rx="6" fill="#ddd" stroke="#bbb" stroke-width="2"/>
  <circle cx="370" cy="120" r="16" fill="#888" stroke="#666" stroke-width="1.5"/>
  <circle cx="370" cy="120" r="10" fill="#aaa"/>
  <rect x="355" y="117" width="30" height="6" rx="3" fill="#fff" stroke="#ddd"/>
  <rect x="367" y="105" width="6" height="30" rx="3" fill="#fff" stroke="#ddd"/>
  <text x="370" y="95" font-family="monospace" font-size="8" fill="#333" text-anchor="middle" font-weight="bold">SG90</text>
  <rect x="295" y="100" width="15" height="40" rx="3" fill="#ccc" stroke="#bbb"/>
  <rect x="425" y="100" width="15" height="40" rx="3" fill="#ccc" stroke="#bbb"/>

  <!-- Servo cable and connector -->
  <line x1="344" y1="160" x2="344" y2="195" stroke="#8B4513" stroke-width="4"/>
  <line x1="357" y1="160" x2="357" y2="195" stroke="#cc0000" stroke-width="4"/>
  <line x1="370" y1="160" x2="370" y2="195" stroke="#ff8800" stroke-width="4"/>
  <!-- Connector block -->
  <rect x="333" y="193" width="48" height="14" rx="2" fill="#333" stroke="#555"/>
  <rect x="336" y="195" width="10" height="10" rx="1" fill="#555"/>
  <rect x="350" y="195" width="10" height="10" rx="1" fill="#555"/>
  <rect x="364" y="195" width="10" height="10" rx="1" fill="#555"/>

  <!-- Wire labels -->
  <text x="344" y="218" font-family="monospace" font-size="8" fill="#c8a070" text-anchor="middle">GND</text>
  <text x="357" y="218" font-family="monospace" font-size="8" fill="#e94560" text-anchor="middle">VCC</text>
  <text x="371" y="218" font-family="monospace" font-size="8" fill="#ff8800" text-anchor="middle">SIG</text>

  <!-- ESP32 wires -->
  <!-- GND → brown (GND) -->
  <polyline points="120,83 220,83 220,225 344,225 344,207" fill="none" stroke="#5599ff" stroke-width="2.5"/>
  <!-- 5V → red (VCC) -->
  <polyline points="120,103 357,103 357,193" fill="none" stroke="#e94560" stroke-width="2.5"/>
  <!-- GPIO13 → orange (SIG) -->
  <polyline points="120,123 371,123 371,193" fill="none" stroke="#ff8800" stroke-width="2.5"/>

  <!-- PWM diagram -->
  <rect x="155" y="55" width="130" height="80" rx="4" fill="#1a1a2e" stroke="#ff8800"/>
  <text x="220" y="68" font-family="monospace" font-size="7.5" fill="#ff8800" text-anchor="middle">50Hz PWM Signal</text>
  <!-- 0° pulse -->
  <text x="165" y="80" font-family="monospace" font-size="7" fill="#888">0°</text>
  <polyline points="175,86 180,86 180,77 186,77 186,86 210,86" fill="none" stroke="#ffcc00" stroke-width="1.5"/>
  <!-- 90° pulse -->
  <text x="165" y="100" font-family="monospace" font-size="7" fill="#888">90°</text>
  <polyline points="175,106 180,106 180,97 189,97 189,106 210,106" fill="none" stroke="#ffcc00" stroke-width="1.5"/>
  <!-- 180° pulse -->
  <text x="165" y="120" font-family="monospace" font-size="7" fill="#888">180°</text>
  <polyline points="175,126 180,126 180,117 192,117 192,126 210,126" fill="none" stroke="#ffcc00" stroke-width="1.5"/>

  <!-- Footer -->
  <rect x="30" y="235" width="420" height="24" rx="4" fill="#1a1a2e" stroke="#333"/>
  <text x="240" y="247" font-family="monospace" font-size="8.5" fill="#888" text-anchor="middle">GND → Brown  |  5V VIN → Red  |  GPIO13 → Orange (PWM signal)</text>
  <text x="240" y="257" font-family="monospace" font-size="7.5" fill="#888" text-anchor="middle">Use ESP32Servo library · 50Hz · 500–2400µs pulse width</text>

  <!-- Title -->
  <text x="240" y="20" font-family="sans-serif" font-size="11" fill="#e94560" text-anchor="middle" font-weight="bold">SG90 Servo Wiring — Zyron ESP32 Starter Kit</text>
  <text x="240" y="34" font-family="sans-serif" font-size="9" fill="#888" text-anchor="middle">zyron.co.za</text>
</svg>

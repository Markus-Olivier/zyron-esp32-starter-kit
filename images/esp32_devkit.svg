<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <rect width="400" height="600" fill="#0f0f1a"/>

  <!-- Title -->
  <text x="200" y="28" font-family="sans-serif" font-size="13" fill="#e94560" text-anchor="middle" font-weight="bold">ESP32 DevKit v1</text>
  <text x="200" y="44" font-family="sans-serif" font-size="9" fill="#888" text-anchor="middle">zyron.co.za</text>

  <!-- PCB body -->
  <rect x="80" y="60" width="240" height="480" rx="10" fill="#1a6b1a" stroke="#2d8a2d" stroke-width="2"/>

  <!-- USB port -->
  <rect x="165" y="52" width="70" height="20" rx="4" fill="#888" stroke="#aaa" stroke-width="1.5"/>
  <rect x="172" y="55" width="56" height="14" rx="2" fill="#555"/>
  <text x="200" y="65" font-family="monospace" font-size="8" fill="#ccc" text-anchor="middle">Micro USB</text>

  <!-- EN and BOOT buttons -->
  <rect x="90" y="80" width="24" height="12" rx="3" fill="#cc3333" stroke="#ff5555"/>
  <text x="102" y="89" font-family="monospace" font-size="7" fill="#fff" text-anchor="middle">EN</text>
  <rect x="286" y="80" width="24" height="12" rx="3" fill="#333399" stroke="#5555ff"/>
  <text x="298" y="89" font-family="monospace" font-size="7" fill="#fff" text-anchor="middle">BOOT</text>

  <!-- ESP32 chip -->
  <rect x="130" y="160" width="140" height="100" rx="4" fill="#222" stroke="#444" stroke-width="1.5"/>
  <text x="200" y="210" font-family="monospace" font-size="10" fill="#aaa" text-anchor="middle" font-weight="bold">ESP32</text>
  <text x="200" y="224" font-family="monospace" font-size="7" fill="#666" text-anchor="middle">Dual-core 240MHz</text>
  <text x="200" y="234" font-family="monospace" font-size="7" fill="#666" text-anchor="middle">WiFi + Bluetooth</text>

  <!-- WiFi antenna area -->
  <rect x="155" y="100" width="90" height="60" rx="3" fill="#1a8a1a" stroke="#2d8a2d" stroke-width="1"/>
  <text x="200" y="135" font-family="monospace" font-size="8" fill="#5f5" text-anchor="middle">PCB Antenna</text>

  <!-- Left pin headers -->
  <!-- Labels -->
  <text x="76" y="105" font-family="monospace" font-size="7.5" fill="#888" text-anchor="end">3V3</text>
  <text x="76" y="125" font-family="monospace" font-size="7.5" fill="#888" text-anchor="end">GND</text>
  <text x="76" y="145" font-family="monospace" font-size="7.5" fill="#888" text-anchor="end">D15</text>
  <text x="76" y="165" font-family="monospace" font-size="7.5" fill="#888" text-anchor="end">D2</text>
  <text x="76" y="185" font-family="monospace" font-size="7.5" fill="#888" text-anchor="end">D4</text>
  <text x="76" y="205" font-family="monospace" font-size="7.5" fill="#888" text-anchor="end">RX2</text>
  <text x="76" y="225" font-family="monospace" font-size="7.5" fill="#888" text-anchor="end">TX2</text>
  <text x="76" y="245" font-family="monospace" font-size="7.5" fill="#888" text-anchor="end">D5</text>
  <text x="76" y="265" font-family="monospace" font-size="7.5" fill="#888" text-anchor="end">D18</text>
  <text x="76" y="285" font-family="monospace" font-size="7.5" fill="#888" text-anchor="end">D19</text>
  <text x="76" y="305" font-family="monospace" font-size="7.5" fill="#888" text-anchor="end">D21</text>
  <text x="76" y="325" font-family="monospace" font-size="7.5" fill="#888" text-anchor="end">RX0</text>
  <text x="76" y="345" font-family="monospace" font-size="7.5" fill="#888" text-anchor="end">TX0</text>
  <text x="76" y="365" font-family="monospace" font-size="7.5" fill="#888" text-anchor="end">D22</text>
  <text x="76" y="385" font-family="monospace" font-size="7.5" fill="#888" text-anchor="end">D23</text>


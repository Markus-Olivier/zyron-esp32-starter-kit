  <text x="324" y="345" font-family="monospace" font-size="7.5" fill="#888" text-anchor="start">SD2</text>
  <text x="324" y="365" font-family="monospace" font-size="7.5" fill="#888" text-anchor="start">SD3</text>
  <text x="324" y="385" font-family="monospace" font-size="7.5" fill="#888" text-anchor="start">CMD</text>
  <text x="324" y="405" font-family="monospace" font-size="7.5" fill="#888" text-anchor="start">SD0</text>
  <text x="324" y="425" font-family="monospace" font-size="7.5" fill="#888" text-anchor="start">CLK</text>
  <text x="324" y="445" font-family="monospace" font-size="7.5" fill="#888" text-anchor="start">GND</text>
  <text x="324" y="465" font-family="monospace" font-size="7.5" fill="#888" text-anchor="start">5V</text>


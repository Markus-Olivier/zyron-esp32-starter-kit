  <circle cx="150" cy="148" r="5" fill="#00cc00"/>
  <text x="150" y="162" font-family="monospace" font-size="7" fill="#5f5" text-anchor="middle">PWR</text>

  <!-- Bottom info bar -->
  <rect x="30" y="552" width="340" height="36" rx="4" fill="#1a1a2e" stroke="#333"/>
  <text x="200" y="565" font-family="monospace" font-size="8" fill="#aaffaa" text-anchor="middle">3.3V logic · 240MHz · 4MB Flash · 520KB RAM</text>
  <text x="200" y="578" font-family="monospace" font-size="8" fill="#888" text-anchor="middle">WiFi 802.11 b/g/n · Bluetooth 4.2 · 38 pins</text>

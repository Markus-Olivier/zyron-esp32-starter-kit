  <text x="324" y="145" font-family="monospace" font-size="7.5" fill="#888" text-anchor="start">D34</text>
  <text x="324" y="165" font-family="monospace" font-size="7.5" fill="#888" text-anchor="start">D35</text>
  <text x="324" y="185" font-family="monospace" font-size="7.5" fill="#888" text-anchor="start">D32</text>
  <text x="324" y="205" font-family="monospace" font-size="7.5" fill="#888" text-anchor="start">D33</text>
  <text x="324" y="225" font-family="monospace" font-size="7.5" fill="#888" text-anchor="start">D25</text>
